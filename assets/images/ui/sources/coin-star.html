<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Star token — editable 3D source</title>
<style>body { margin: 0; background: #222; } canvas { display: block; }</style>
<canvas id="coin"></canvas>
<script type="module">
  import * as THREE from '/libs/three/build/three.module.js'

  // UI exports use the Avatar coin's cylinder, with the homepage token's rim and star.
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('coin'), alpha: true, antialias: false, preserveDrawingBuffer: true })
  renderer.setSize(96, 96)
  renderer.setClearColor(0x000000, 0)
  const scene = new THREE.Scene()
  const camera = new THREE.OrthographicCamera(-1.16, 1.16, 1.16, -1.16, .1, 20)
  camera.position.z = 5
  scene.add(new THREE.AmbientLight(0xffffff, 1.6))
  const light = new THREE.DirectionalLight(0xfff1ce, 2.1)
  light.position.set(-3, 5, 7)
  scene.add(light)
  const backLight = new THREE.DirectionalLight(0xffe4ac, 1.3)
  backLight.position.set(3, 2, -5)
  scene.add(backLight)

  const gold = new THREE.MeshPhongMaterial({ color: 0xdca642, shininess: 22, specular: 0x5a3b14 })
  const edge = new THREE.MeshPhongMaterial({ color: 0xa06c23, shininess: 18 })
  const rim = new THREE.MeshPhongMaterial({ color: 0xf3cf7d, shininess: 25 })
  const dark = new THREE.MeshPhongMaterial({ color: 0x8b551a, shininess: 8 })
  const coin = new THREE.Group()
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .2, 32), [edge, gold, gold])
  body.rotation.x = Math.PI / 2
  coin.add(body)

  const star = new THREE.Shape()
  for (let i = 0; i < 10; i++) {
    const angle = Math.PI / 2 + i * Math.PI / 5
    const radius = i % 2 ? .27 : .61
    const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius
    if (i === 0) star.moveTo(x, y)
    else star.lineTo(x, y)
  }
  star.closePath()
  const starGeometry = new THREE.ExtrudeGeometry(star, { depth: .012, bevelEnabled: true, bevelThickness: .006, bevelSize: .008, bevelSegments: 1, steps: 1 })
  for (const side of [1, -1]) {
    const face = new THREE.Group()
    face.rotation.y = side === 1 ? 0 : Math.PI
    face.position.z = side * .1
    const border = new THREE.Mesh(new THREE.TorusGeometry(.88, .035, 6, 48), rim)
    border.position.z = .008
    const outer = new THREE.Mesh(new THREE.TorusGeometry(.975, .023, 6, 48), edge)
    outer.position.z = .003
    const emblem = new THREE.Mesh(starGeometry, dark)
    emblem.position.z = .005
    face.add(border, outer, emblem)
    coin.add(face)
  }
  scene.add(coin)
  window.renderCoin = angle => {
    coin.rotation.y = angle + .15
    renderer.render(scene, camera)
    return renderer.domElement.toDataURL('image/png')
  }
  window.renderCoin(0)
  window.coinReady = true
</script>
</html>
