      <use href="#tailplane"/>
      <use href="#tailplane" transform="matrix(-1 0 0 1 177 0)"/>
      <use href="#fuselage"/>
      <use href="#engine"/>
      <use href="#engine" transform="matrix(-1 0 0 1 177 0)"/>
    </clipPath>
  </defs>

  <ellipse cx="50.5" cy="21" rx="17" ry="2" fill="#2a2a2a" opacity=".35"/>
  <ellipse cx="126.5" cy="21" rx="17" ry="2" fill="#2a2a2a" opacity=".35"/>

  <g stroke="#1b1d1f" stroke-width="1" stroke-linejoin="round" fill="#7a8285">
