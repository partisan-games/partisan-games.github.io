    <path id="wing" d="M88.5 44 L 11 50 C 4 50.5 2.5 54 2.5 57 C 2.5 60 4 63 11 63.5 L 88.5 70 Z"/>
    <path id="tailplane" d="M88.5 112 L 62 113 L 62 122 L 88.5 123 Z"/>
    <path id="fuselage" d="M88.5 3 C 94 4 95.5 14 95.5 30 C 95.5 60 92.5 94 91 124 L 86 124 C 84.5 94 81.5 60 81.5 30 C 81.5 14 83 4 88.5 3 Z"/>
    <path id="engine" d="M50.5 22 C 56.5 22 57.5 28 57.5 36 L 56 82 C 56 86 45 86 45 82 L 43.5 36 C 43.5 28 44.5 22 50.5 22 Z"/>
    <g id="cross">
      <path d="M-5.5 -2 H -2 V -5.5 H 2 V -2 H 5.5 V 2 H 2 V 5.5 H -2 V 2 H -5.5 Z" fill="#f2f2f2"/>
      <path d="M-5.5 -1 H -1 V -5.5 H 1 V -1 H 5.5 V 1 H 1 V 5.5 H -1 V 1 H -5.5 Z" fill="#111"/>
    </g>
    <clipPath id="skin">
