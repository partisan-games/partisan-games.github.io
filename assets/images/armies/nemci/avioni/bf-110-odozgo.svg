  <path d="M85.6 31 H 91.4 M85.6 38 H 91.4 M85.6 45 H 91.4 M85.6 52 H 91.4" stroke="#1b1d1f" stroke-width=".55"/>
  <path d="M87 25 C 87.2 23 87.8 22 88.8 22" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".9"/>
