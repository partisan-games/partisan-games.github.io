<svg xmlns="http://www.w3.org/2000/svg" width="177" height="132" viewBox="0 0 177 132">
  <!-- Messerschmitt Bf 110 G from above, nose up: two engines, long canopy, twin fins at the tailplane tips, Balkenkreuz on the wings -->
