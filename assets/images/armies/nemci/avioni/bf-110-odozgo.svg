    <use href="#wing" transform="matrix(-1 0 0 1 177 0)"/>
    <use href="#tailplane"/>
    <use href="#tailplane" transform="matrix(-1 0 0 1 177 0)"/>
    <use href="#fuselage"/>
    <use href="#engine"/>
    <use href="#engine" transform="matrix(-1 0 0 1 177 0)"/>
