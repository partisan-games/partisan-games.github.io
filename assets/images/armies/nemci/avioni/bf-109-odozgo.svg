<svg xmlns="http://www.w3.org/2000/svg" width="115" height="104" viewBox="0 0 115 104">
  <!-- Messerschmitt Bf 109 G from above, nose up: grey Luftwaffe camouflage, yellow theatre band, Balkenkreuz on the wings -->
  <defs>
    <path id="wing" d="M57.5 32 L 9 38 C 3 39 2 42 2 45 C 2 48 4 50 9 50 L 57.5 54 Z"/>
    <path id="tailplane" d="M57.5 88 L 45 89 C 41 89.5 40 91 40 93 C 40 95 41 96 45 96.5 L 57.5 97 Z"/>
    <path id="fuselage" d="M57.5 3 C 62.5 4 64 12 64 26 C 64 50 61 76 59.5 100 L 55.5 100 C 54 76 51 50 51 26 C 51 12 52.5 4 57.5 3 Z"/>
    <g id="cross">
      <path d="M-5.5 -2 H -2 V -5.5 H 2 V -2 H 5.5 V 2 H 2 V 5.5 H -2 V 2 H -5.5 Z" fill="#f2f2f2"/>
      <path d="M-5.5 -1 H -1 V -5.5 H 1 V -1 H 5.5 V 1 H 1 V 5.5 H -1 V 1 H -5.5 Z" fill="#111"/>
    </g>
    <clipPath id="skin">
      <use href="#wing"/>
      <use href="#wing" transform="matrix(-1 0 0 1 115 0)"/>
      <use href="#tailplane"/>
      <use href="#tailplane" transform="matrix(-1 0 0 1 115 0)"/>
      <use href="#fuselage"/>
    </clipPath>
  </defs>

  <ellipse cx="57.5" cy="3" rx="18" ry="2" fill="#2a2a2a" opacity=".35"/>

  <g stroke="#1b1d1f" stroke-width=".9" stroke-linejoin="round" fill="#7d8486">
    <use href="#wing"/>
    <use href="#wing" transform="matrix(-1 0 0 1 115 0)"/>
    <use href="#tailplane"/>
    <use href="#tailplane" transform="matrix(-1 0 0 1 115 0)"/>
    <use href="#fuselage"/>
  </g>

  <g clip-path="url(#skin)" fill="#555c60">
    <path d="M0 36 L 20 34 L 30 44 L 22 52 L 0 50 Z"/>
    <path d="M38 34 L 57.5 30 L 57.5 56 L 46 54 Z"/>
    <path d="M115 44 L 92 40 L 80 50 L 115 54 Z"/>
    <path d="M50 6 L 66 14 L 66 30 L 50 22 Z"/>
    <path d="M50 60 L 66 66 L 66 78 L 50 72 Z"/>
    <path d="M38 88 L 57.5 86 L 57.5 98 L 42 98 Z"/>
    <path d="M77 90 L 70 98 L 77 98 Z"/>
  </g>
  <rect x="50" y="70" width="16" height="5" fill="#e8c21a" clip-path="url(#skin)"/>

  <g fill="none" stroke="#000" stroke-opacity=".25" stroke-width=".6">
    <path d="M8 49 L 34 52 M107 49 L 81 52"/>
    <path d="M53 22 H 62"/>
  </g>
  <rect x="56.3" y="85" width="2.4" height="17" rx="1" fill="#686f72" stroke="#1b1d1f" stroke-width=".7"/>

  <use href="#cross" x="22" y="44"/>
  <use href="#cross" x="93" y="44"/>

  <path d="M55 32 C 55 29 56 28 57.5 28 C 59 28 60 29 60 32 L 59.8 46 L 55.2 46 Z" fill="#8a9ba5" stroke="#1b1d1f" stroke-width=".8"/>
  <path d="M55.2 36 H 59.8 M55.2 41 H 59.8" stroke="#1b1d1f" stroke-width=".5"/>
  <ellipse cx="57.5" cy="5.5" rx="3.6" ry="4.5" fill="#27302a" stroke="#1b1d1f" stroke-width=".7"/>
  <path d="M57.5 1.5 C 59.5 3 59.8 6 57.5 9" fill="none" stroke="#f2f2f2" stroke-width="1"/>
</svg>
