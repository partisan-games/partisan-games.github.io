<svg xmlns="http://www.w3.org/2000/svg" width="115" height="100" viewBox="0 0 115 100">
  <!-- Focke-Wulf Fw 190 A from above, nose up: grey Luftwaffe camouflage, white theatre band, Balkenkreuz on the wings -->
  <defs>
    <path id="wing" d="M57.5 31 L 9 37 C 3 38 2 41 2 43.5 C 2 46 3 48 9 48.5 L 57.5 54 Z"/>
    <path id="tailplane" d="M57.5 84 L 43 85.5 C 39.5 86 38.5 87.5 38.5 89.5 C 38.5 91.5 39.5 92.5 43 93 L 57.5 94 Z"/>
    <path id="fuselage" d="M57.5 3 C 65 3 66 6 66 14 C 66 32 63 64 60 96 L 55 96 C 52 64 49 32 49 14 C 49 6 50 3 57.5 3 Z"/>
    <g id="cross">
      <path d="M-5.5 -2 H -2 V -5.5 H 2 V -2 H 5.5 V 2 H 2 V 5.5 H -2 V 2 H -5.5 Z" fill="#f2f2f2"/>
      <path d="M-5.5 -1 H -1 V -5.5 H 1 V -1 H 5.5 V 1 H 1 V 5.5 H -1 V 1 H -5.5 Z" fill="#111"/>
    </g>
    <clipPath id="skin">
      <use href="#wing"/>
      <use href="#wing" transform="matrix(-1 0 0 1 115 0)"/>
      <use href="#tailplane"/>
      <use href="#tailplane" transform="matrix(-1 0 0 1 115 0)"/>
      <use href="#fuselage"/>
    </clipPath>
  </defs>

  <ellipse cx="57.5" cy="2.5" rx="19" ry="2" fill="#2a2a2a" opacity=".35"/>

  <g stroke="#1b1d1f" stroke-width=".9" stroke-linejoin="round" fill="#6f777a">
    <use href="#wing"/>
    <use href="#wing" transform="matrix(-1 0 0 1 115 0)"/>
    <use href="#tailplane"/>
    <use href="#tailplane" transform="matrix(-1 0 0 1 115 0)"/>
    <use href="#fuselage"/>
  </g>

  <g clip-path="url(#skin)" fill="#4b5256">
    <path d="M0 40 L 16 34 L 28 38 L 34 54 L 0 50 Z"/>
    <path d="M115 36 L 96 34 L 84 46 L 90 54 L 115 50 Z"/>
    <path d="M48 16 L 57.5 12 L 67 22 L 67 34 L 48 28 Z"/>
    <path d="M48 52 L 67 58 L 67 70 L 48 64 Z"/>
    <path d="M36 84 L 50 84 L 57.5 96 L 36 96 Z"/>
    <path d="M79 84 L 72 94 L 79 96 Z"/>
  </g>
  <rect x="48" y="68" width="20" height="5" fill="#ececec" clip-path="url(#skin)"/>
  <path d="M49.3 9 H 65.7 V 13 H 49.3 Z" fill="#3a3f42" clip-path="url(#skin)"/>

  <g fill="none" stroke="#000" stroke-opacity=".25" stroke-width=".6">
    <path d="M8 48 L 34 51.5 M107 48 L 81 51.5"/>
    <path d="M52 26 H 63"/>
  </g>
  <g fill="#1b1d1f">
    <rect x="40" y="30" width="1.5" height="5"/>
    <rect x="73.5" y="30" width="1.5" height="5"/>
  </g>
  <rect x="56.3" y="80" width="2.4" height="18" rx="1" fill="#5d6568" stroke="#1b1d1f" stroke-width=".7"/>

  <use href="#cross" x="24" y="43"/>
  <use href="#cross" x="91" y="43"/>

  <path d="M54.5 33 C 54.5 30 55.8 28.5 57.5 28.5 C 59.2 28.5 60.5 30 60.5 33 L 60 46 L 55 46 Z" fill="#9fb0ba" stroke="#1b1d1f" stroke-width=".8"/>
  <path d="M56 32.5 C 56.3 31 57 30.3 58 30.3" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".9"/>
  <circle cx="57.5" cy="5" r="3.6" fill="#27302a" stroke="#1b1d1f" stroke-width=".7"/>
  <path d="M57.5 1.4 C 60 2.5 60.5 6 58 8.5" fill="none" stroke="#f2f2f2" stroke-width="1"/>
</svg>
