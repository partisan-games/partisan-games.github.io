<svg xmlns="http://www.w3.org/2000/svg" width="150" height="122" viewBox="0 0 150 122">
  <!-- Hawker Hurricane Mk IIC of No. 351 (Yugoslav) Squadron RAF from above, nose up: RAF camouflage, red star in place of the roundel's red centre -->
  <defs>
    <path id="wing" d="M75 34 L 12 41 C 4 42 2 46 2 51 C 2 56 5 58 12 58 L 75 67 Z"/>
    <path id="tailplane" d="M75 100 L 58 101 C 51 102 49 105 49 108 C 49 112 52 114 58 114 L 75 115 Z"/>
    <path id="fuselage" d="M75 6 C 84 7 86 18 86 34 C 86 60 82 92 78 117 L 72 117 C 68 92 64 60 64 34 C 64 18 66 7 75 6 Z"/>
    <polygon id="star" points="0,-1 0.2245,-0.309 0.951,-0.309 0.363,0.118 0.588,0.809 0,0.382 -0.588,0.809 -0.363,0.118 -0.951,-0.309 -0.2245,-0.309"/>
    <g id="roundel">
      <circle r="8.5" fill="#24346a"/>
      <circle r="5.6" fill="#f2f0e6"/>
      <use href="#star" transform="scale(5)" fill="#c8102e"/>
    </g>
    <clipPath id="skin">
      <use href="#wing"/>
      <use href="#wing" transform="matrix(-1 0 0 1 150 0)"/>
      <use href="#tailplane"/>
      <use href="#tailplane" transform="matrix(-1 0 0 1 150 0)"/>
      <use href="#fuselage"/>
    </clipPath>
  </defs>

  <ellipse cx="75" cy="5" rx="25" ry="2.4" fill="#2a2a2a" opacity=".35"/>

  <g stroke="#1e2320" stroke-width="1" stroke-linejoin="round" fill="#7a6747">
    <use href="#wing"/>
    <use href="#wing" transform="matrix(-1 0 0 1 150 0)"/>
    <use href="#tailplane"/>
    <use href="#tailplane" transform="matrix(-1 0 0 1 150 0)"/>
    <use href="#fuselage"/>
  </g>

  <g clip-path="url(#skin)" fill="#47512e">
    <path d="M0 40 C 10 46 20 40 28 47 C 36 54 46 46 54 52 L 58 68 C 44 64 32 66 20 60 C 10 56 4 60 0 56 Z"/>
    <path d="M150 58 C 140 52 130 58 120 52 C 110 46 102 54 94 48 L 90 34 C 104 37 120 36 134 40 C 142 42 148 46 150 48 Z"/>
    <path d="M64 8 C 74 14 82 20 88 18 L 88 40 C 78 38 70 34 62 28 Z"/>
    <path d="M62 70 C 72 74 80 70 88 78 L 88 94 C 78 92 70 96 62 88 Z"/>
    <path d="M48 100 C 58 108 66 102 76 108 L 76 116 C 64 116 54 114 48 112 Z"/>
    <path d="M102 104 C 94 108 88 106 82 110 L 102 116 Z"/>
  </g>

  <g fill="none" stroke="#000" stroke-opacity=".25" stroke-width=".7">
    <path d="M10 56 L 44 61 M140 56 L 106 61"/>
    <path d="M55 111 L 73 113 M95 111 L 77 113"/>
    <path d="M67 30 H 83 M68 80 H 82"/>
  </g>

  <g fill="#1e2320">
    <rect x="46" y="30" width="1.8" height="8"/>
    <rect x="51" y="30.5" width="1.8" height="7.5"/>
    <rect x="97.2" y="30.5" width="1.8" height="7.5"/>
    <rect x="102.2" y="30" width="1.8" height="8"/>
  </g>
  <g fill="#2b2b2b">
    <rect x="66.2" y="15" width="2" height="13" rx="1"/>
    <rect x="81.8" y="15" width="2" height="13" rx="1"/>
  </g>
  <rect x="73.5" y="98" width="3" height="21" rx="1.2" fill="#5a4c34" stroke="#1e2320" stroke-width=".8"/>

  <use href="#roundel" x="30" y="51"/>
  <use href="#roundel" x="120" y="51"/>

  <path d="M70.5 46 C 70.5 41 72 38.5 75 38.5 C 78 38.5 79.5 41 79.5 46 L 79 62 L 71 62 Z" fill="#8fa6b4" stroke="#1e2320" stroke-width=".9"/>
  <path d="M71 50 H 79 M71 56 H 79" stroke="#1e2320" stroke-width=".6"/>
  <path d="M72.5 45 C 72.8 42 74 41 75.5 41" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
  <ellipse cx="75" cy="8.5" rx="5" ry="5.5" fill="#2f2f2c" stroke="#1e2320" stroke-width=".8"/>
</svg>
