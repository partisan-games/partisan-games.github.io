    <ellipse cx="137" cy="11" rx="4" ry="2"/><ellipse cx="137" cy="43" rx="4" ry="2"/>
  </g>
  <!-- Paired forward torpedo tubes, without spare torpedoes on the deck. -->
  <g fill="url(#tube)" stroke="#495b52" stroke-width=".8">
    <path d="M165 9H233Q237 9 237 13Q237 17 233 17H165Z"/>
    <path d="M165 37H233Q237 37 237 41Q237 45 233 45H165Z"/>
