<svg xmlns="http://www.w3.org/2000/svg" width="300" height="54" viewBox="0 0 300 54">
  <defs>
    <linearGradient id="hull" x2="0" y2="1"><stop stop-color="#e2e1d6"/><stop offset=".45" stop-color="#a7b0a7"/><stop offset="1" stop-color="#596861"/></linearGradient>
    <linearGradient id="deck" x2="0" y2="1"><stop stop-color="#778078"/><stop offset=".5" stop-color="#939789"/><stop offset="1" stop-color="#616d65"/></linearGradient>
    <linearGradient id="cabin" x2="0" y2="1"><stop stop-color="#eff0df"/><stop offset=".5" stop-color="#b8bfb2"/><stop offset="1" stop-color="#7f8e83"/></linearGradient>
    <linearGradient id="tube" x2="0" y2="1"><stop stop-color="#d5d9cd"/><stop offset=".3" stop-color="#b2b9ae"/><stop offset=".65" stop-color="#829087"/><stop offset="1" stop-color="#515d58"/></linearGradient>
    <clipPath id="deckClip"><path d="M10 10 Q133 1 217 10 Q264 14 291 27 Q264 40 217 44 Q133 53 10 44Z"/></clipPath>
