  <path d="M205 20L210 22V26H205Z M205 28H210V32L205 34Z" fill="#294b4d" stroke="#dee3d3" stroke-width=".6"/>
  <path d="M178 18H185 M189 18H197 M178 36H185 M189 36H197" stroke="#355153" stroke-width="1.5"/>
  <rect x="181" y="23" width="13" height="8" rx="1" fill="#adb7a7" stroke="#6b7b6b"/>
  <path d="M195 20V34 M195 23L204 21 M195 31L204 33" stroke="#65786c" stroke-width=".8"/>
