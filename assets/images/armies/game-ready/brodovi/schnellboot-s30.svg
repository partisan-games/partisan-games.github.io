  <g fill="#5d6a61" stroke="#bbc0b1" stroke-width=".8">
    <rect x="99" y="16" width="31" height="22" rx="2"/>
    <rect x="137" y="16" width="25" height="22" rx="2"/>
    <rect x="25" y="20" width="18" height="14" rx="2"/>
  </g>
  <g stroke="#344740" stroke-width="1.5"><path d="M104 19V35 M109 19V35 M114 19V35 M119 19V35 M124 19V35 M142 19V35 M147 19V35 M152 19V35 M157 19V35"/></g>
  <g fill="#c8ccbe" stroke="#4b5d54" stroke-width=".8">
