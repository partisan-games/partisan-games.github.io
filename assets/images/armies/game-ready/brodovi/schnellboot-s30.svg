  <path d="M9 8 Q133 0 218 9 Q265 13 294 27 Q265 41 218 45 Q133 54 9 46Z" fill="url(#hull)" stroke="#d5d9ca" stroke-width=".7"/>
  <path d="M12 12 Q133 4 215 12 Q263 16 286 27 Q263 38 215 42 Q133 50 12 42Z" fill="url(#deck)" stroke="#53665d"/>
  <g clip-path="url(#deckClip)" stroke="#bac0ad" stroke-opacity=".32" stroke-width=".6">
