<!doctype html>
<html lang="sr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rekviziti bojišta</title>
<style>
  :root{color-scheme:dark;font:15px/1.4 system-ui,sans-serif;background:#232820;color:#eee}
  body{margin:0;padding:18px}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0 14px;color:#bdc5b6}
  a{color:#d5db95}button,select,input{font:inherit}button,select{padding:7px 10px}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
  main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
  aside{max-height:75vh;overflow:auto;border:1px solid #56604d;padding:10px}h2{font-size:16px;margin:12px 0 8px}
  .palette{display:grid;grid-template-columns:1fr 1fr;gap:7px}.palette button{min-width:0;background:#343c2f;color:#eee;border:1px solid #5d6853;font-size:12px;overflow-wrap:anywhere}
  .palette button[aria-pressed=true]{outline:2px solid #f1cd67;background:#4b563b}
  .palette img{display:block;width:100%;height:62px;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#4d5547 0 25%,#3b4337 0 50%) 0/12px 12px;margin-bottom:5px}
  canvas{display:block;width:100%;height:auto;touch-action:none;image-rendering:pixelated;border:1px solid #69725f;box-sizing:border-box;cursor:crosshair}
  canvas:focus-visible{outline:3px solid #f1cd67}textarea{width:100%;min-height:120px;box-sizing:border-box;font:12px/1.4 monospace;margin-top:8px}
  label{display:inline-flex;gap:6px;align-items:center}#status{min-height:22px}details{margin-top:12px}
  @media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:250px}.palette{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
</style>
<h1>Rekviziti bojišta</h1>
<p>Izaberi objekat i klikni na prazno mesto. Postavljeni objekat prevuci mišem; odabrani možeš obrisati tasterom Delete. Raspored se ne upisuje u pozadinu.</p>
<div class="toolbar">
  <label>Pozadina <select id="background"></select></label>
  <label>Razmera <input id="scale" type="range" min="0.2" max="2" step="0.01" value="1"><output id="scale-value">1</output></label>
  <label><input id="flip" type="checkbox">Okreni</label>
  <button id="remove" disabled>Obriši izabrano</button><button id="clear">Očisti raspored</button>
  <button id="download">Preuzmi raspored</button><button id="pause">Pauziraj ambijent</button>
</div>
<p id="status" role="status">Učitavanje kataloga…</p>
<main>
  <aside aria-label="Izbor rekvizita"></aside>
  <section>
    <canvas width="1536" height="1024" tabindex="0" aria-label="Postavljanje zasebnih rekvizita na pozadinu"></canvas>
    <details><summary>Raspored objekata</summary><textarea id="placements" readonly aria-label="Raspored u JSON formatu"></textarea></details>
    <p><a href="/pozadine.html">Pregled pozadina</a> · <a href="/assets/images/sources/scenery/catalog.json">Katalog i sidrišta</a></p>
  </section>
</main>
<script type="module">
  import SceneryLayer from '/core/SceneryLayer.js'
  import art from '/core/sceneryArt.js'
  import { battlefields } from '/scenes/tenkici/BattleBackground.js'
  import renderLayers from '/scenes/tenkici/renderLayers.js'

  const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d')
  const backgroundSelect = document.querySelector('#background'), status = document.querySelector('#status')
  const scale = document.querySelector('#scale'), flip = document.querySelector('#flip')
  const scaleValue = document.querySelector('#scale-value'), remove = document.querySelector('#remove')
  const placements = document.querySelector('#placements')
  let layer = new SceneryLayer()
  const names = { city:'Grad', bihac:'Bihać', drvar:'Drvar', uzice:'Užice', sremFront1944:'Sremski front 1944', batina:'Batina', sremFront1945:'Sremski front 1945', grahovo:'Grahovo', vilusi:'Vilusi', niksic:'Okolina Nikšića' }
  const backgrounds = Object.entries(battlefields).map(([id, place]) => ({ id, name:names[id], ...place }))
  for (const [id, name, file] of [['neretva','Neretva','neretva-late-winter-1943-pixel.png'],['sutjeska','Sutjeska','sutjeska-1943-pixel.png'],['kozara','Kozara','kozara-early-summer-1942-pixel.png'],['stone-village','Kameno selo','crnogorsko-selo-1941-pixel.png']])
    backgrounds.push({ id, name, src:'background/' + file })
  for (const bg of backgrounds) backgroundSelect.add(new Option(bg.name, bg.id))

  let background, selected = null, activeId = 'partisan-fallen-prone', dirty = true, loading = 0
  let elapsed = 0, previous = 0, paused = false, drag = null
  const drafts = new Map()
  let items = []
  const load = src => new Promise((resolve, reject) => {
    const image = new Image()
    image.onload = () => resolve(image)
    image.onerror = () => reject(new Error('Nije učitana slika: ' + src))
    image.src = src
  })

  function describe() {
    placements.value = JSON.stringify({ background:background?.src, coordinateSpace:'background-image-pixels', props:items }, null, 2)
    remove.disabled = !selected
    scaleValue.value = scale.value
    dirty = true
  }

  async function changeBackground() {
    const request = ++loading, bg = backgrounds.find(bg => bg.id === backgroundSelect.value)
    const nextItems = drafts.get(bg.id) ?? (bg.props ?? []).map(item => ({ ...item }))
    const nextLayer = new SceneryLayer(nextItems)
    background = selected = drag = null
    items = []
    describe()
    status.textContent = 'Učitavanje pozadine…'
    try {
      const [base] = await Promise.all([load('/assets/images/' + bg.src), nextLayer.ready])
      let live
      if (bg.layers) {
        const folder = '/assets/images/' + bg.layers
        const response = await fetch(folder + 'layout.json')
        if (!response.ok) throw new Error('Nije učitan opis animirane pozadine.')
        const layout = await response.json()
        const [clouds, actors] = await Promise.all([load(folder + 'clouds.png'), bg.actors !== false && load(folder + 'actors.png')])
        live = { layout, images:{ base, clouds, actors } }
      }
      if (request !== loading) return
      background = { ...bg, base, live }
      layer = nextLayer
      items = nextItems
      drafts.set(bg.id, items)
      canvas.width = base.naturalWidth
      canvas.height = base.naturalHeight
      status.textContent = bg.name + ' · ' + canvas.width + '×' + canvas.height
      describe()
    } catch (error) { if (request === loading) status.textContent = error.message }
  }

  function select(item) {
    selected = item
    if (item) { scale.value = item.scale; flip.checked = Boolean(item.flip) }
    describe()
  }

  for (const [kind, title] of [['fallen','Poginuli vojnici'],['blood','Tragovi krvi'],['wreck','Olupine']]) {
    const heading = document.createElement('h2'), palette = document.createElement('div')
    heading.textContent = title
    palette.className = 'palette'
    for (const [id, prop] of Object.entries(art).filter(([, prop]) => prop.kind === kind)) {
      const button = document.createElement('button'), image = document.createElement('img')
      image.src = '/assets/images/' + prop.src
      image.alt = ''
      button.append(image, id.replaceAll('-', ' '))
      button.setAttribute('aria-pressed', String(id === activeId))
      button.onclick = () => {
        activeId = id
        document.querySelectorAll('.palette button').forEach(button => button.setAttribute('aria-pressed', 'false'))
        button.setAttribute('aria-pressed', 'true')
        select(null)
      }
      palette.append(button)
    }
    document.querySelector('aside').append(heading, palette)
  }

  const point = event => {
    const rect = canvas.getBoundingClientRect()
    return { x:(event.clientX - rect.left) * canvas.width / rect.width, y:(event.clientY - rect.top) * canvas.height / rect.height }
  }
  canvas.onpointerdown = async event => {
    if (!background) return
    canvas.focus()
    const p = point(event)
    const hit = [...layer.orderedItems].reverse().find(item => {
      const prop = art[item.id], x = (p.x - item.x) / item.scale * (item.flip ? -1 : 1), y = (p.y - item.y) / item.scale
      return x >= -prop.anchor.x && x <= prop.width - prop.anchor.x && y >= -prop.anchor.y && y <= prop.height - prop.anchor.y
    })
    if (hit) {
      select(hit)
      drag = { item:hit, x:p.x - hit.x, y:p.y - hit.y }
      canvas.setPointerCapture(event.pointerId)
    } else {
      const item = { id:activeId, x:Math.round(p.x), y:Math.round(p.y), scale:Number(scale.value), flip:flip.checked }
      items.push(item)
      select(item)
      try { await layer.setItems(items); dirty = true }
      catch (error) { status.textContent = error.message }
    }
  }
  canvas.onpointermove = event => {
    if (!drag) return
    const p = point(event)
    drag.item.x = Math.round(p.x - drag.x)
    drag.item.y = Math.round(p.y - drag.y)
    describe()
  }
  canvas.onpointerup = canvas.onpointercancel = () => { drag = null }
  function removeSelected() {
    if (!selected) return
    items.splice(items.indexOf(selected), 1)
    select(null)
  }
  canvas.onkeydown = event => {
    if (event.key === 'Delete') { event.preventDefault(); removeSelected() }
  }
  remove.onclick = removeSelected
  scale.oninput = () => { if (selected) selected.scale = Number(scale.value); describe() }
  flip.onchange = () => { if (selected) selected.flip = flip.checked; describe() }
  document.querySelector('#clear').onclick = () => { items.length = 0; select(null) }
  document.querySelector('#download').onclick = () => {
    if (!background) return
    const url = URL.createObjectURL(new Blob([placements.value], { type:'application/json' })), link = document.createElement('a')
    link.href = url
    link.download = 'rekviziti-' + backgroundSelect.value + '.json'
    link.click()
    setTimeout(() => URL.revokeObjectURL(url), 1000)
  }
  document.querySelector('#pause').onclick = event => {
    paused = !paused
    event.target.textContent = paused ? 'Nastavi ambijent' : 'Pauziraj ambijent'
  }
  backgroundSelect.onchange = () => {
    history.replaceState(null, '', '#' + backgroundSelect.value)
    changeBackground()
  }
  function frame(now) {
    if (previous && !paused) elapsed += Math.min((now - previous) / 1000, .1)
    previous = now
    if (background && (dirty || background.live && !paused)) {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.imageSmoothingEnabled = false
      if (background.live) renderLayers(ctx, background.live.images, background.live.layout, elapsed, { actors:background.actors !== false })
      else ctx.drawImage(background.base, 0, 0)
      layer.render(ctx)
      if (selected) {
        const prop = art[selected.id], left = selected.flip ? prop.width - prop.anchor.x : prop.anchor.x
        ctx.strokeStyle = '#f1cd67'
        ctx.lineWidth = 2
        ctx.strokeRect(selected.x - left * selected.scale, selected.y - prop.anchor.y * selected.scale, prop.width * selected.scale, prop.height * selected.scale)
      }
      dirty = false
    }
    requestAnimationFrame(frame)
  }
  const openAddress = () => {
    const id = location.hash.slice(1)
    backgroundSelect.value = backgrounds.some(bg => bg.id === id) ? id : 'grahovo'
    return changeBackground()
  }
  window.addEventListener('hashchange', openAddress)
  await openAddress()
  requestAnimationFrame(frame)
</script>
</html>
