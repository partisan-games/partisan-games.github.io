<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UI — pregled</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/ui/style.css">
  <link rel="stylesheet" href="/ui/arcade.css">
  <style>
    body { padding: 24px; }
    .preview-header { max-width: 1350px; margin: 0 auto 24px; font: 16px/1.5 system-ui,sans-serif; text-shadow: none; }
    .preview-header h1 { margin: 0 0 8px; color: white; text-align: left; font: 600 24px/1.3 system-ui,sans-serif; }
    .preview-header p { margin: 0 0 12px; color: #ccc; }
    .preview-home { display: inline-block; margin-bottom: 12px; color: #ccc; }
    .preview-scroll { max-width: 1350px; margin: auto; overflow-x: auto; }
    .preview-table { width: 100%; min-width: 1040px; table-layout: fixed; border-spacing: 24px 12px; }
    .preview-table thead th { padding-bottom: 8px; font: 600 18px/1.4 system-ui,sans-serif; text-shadow: none; }
    .preview-table col:first-child { width: 112px; }
    .preview-table tbody th { color: #ccc; text-align: left; font: 600 14px/1.4 system-ui,sans-serif; text-shadow: none; }
    .preview-table td { padding: 0; }
    .preview-stage { min-height: 220px; display: grid; place-items: center; padding: 16px; }
    .preview-stage .central-screen { position: static; top: auto; left: auto; transform: none; min-width: 0; width: 100%; }
    .preview-scroll > section { margin-bottom: 32px; }
    .preview-scroll > section > h2 { margin: 0 24px; text-align: left; font: 600 20px/1.4 system-ui,sans-serif; text-shadow: none; }
    /* the games pin these to the screen's corners; here they stand in their cells */
    .preview-stage :is(.top-left, .top-right, .bottom-left, .bottom-right, .pause-button, .arcade-wallet,
      .joystick, .button-container), .preview-touch > *, section > .arcade-wallet { position: static; transform: none; }
    section > .arcade-wallet { display: inline-flex; margin: 12px 24px; }
    .preview-touch { display: flex; justify-content: space-between; align-items: end; max-width: 520px; margin: 12px 24px; }
    /* each card as wide and tall as what it shows, never cutting it */
    .preview-icons { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 24px; }
    .preview-icons > div { display: grid; grid-template-rows: auto minmax(80px, auto); gap: 6px; min-width: 140px; padding: 8px; border: 1px solid #555; }
    .preview-icons dt { color: #ccc; text-align: center; overflow-wrap: anywhere; font: 13px/1.3 system-ui,sans-serif; text-shadow: none; }
    .preview-icons dd { display: grid; place-items: center; margin: 0; }
    .preview-icon .icon-art { width: 64px; height: 64px; }
    @media (max-width: 440px) { body { padding: 16px; } }
    @media (max-width: 360px) {
      body { padding: 8px; }
    }
  </style>
</head>
<body>
  <header class="preview-header">
    <a class="preview-home" href="/">← Početna</a>
    <h1>UI — pregled</h1>
    <p>Svi UI elementi igara, nacrtani istim kodom kao u igrama; dugmad ne pokreću igru i ne troše žetone.</p>
    <label><input type="checkbox" id="coins-available" checked> Žetoni dostupni</label>
  </header>
  <main class="preview-scroll" id="preview" tabindex="0" aria-label="UI elementi po temama"></main>
  <script type="module">
    import renderPreview from '/pages/ui.js'
    const showTokens = renderPreview(document.getElementById('preview'))
    const coins = document.getElementById('coins-available')
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)')
    const update = () => showTokens(coins.checked)
    coins.addEventListener('change', update)
    reducedMotion.addEventListener('change', update)
    update()
  </script>
</body>
</html>
