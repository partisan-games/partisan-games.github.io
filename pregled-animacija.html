<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pregled animacija aktera</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 78rem; margin: auto; padding: 1rem clamp(.8rem,4vw,3rem) 4rem; }
    h1,h2,h3 { line-height: 1.2; }
    table { border-collapse: collapse; width: 100%; text-align: left; margin: .65rem 0 1.3rem; }
    th,td { padding: .35rem .5rem; vertical-align: top; border-bottom: 1px solid #8887; }
    details { border-bottom: 1px solid #8887; }
    summary { cursor: pointer; padding: .5rem 0; font-weight: 600; }
    details > div { padding-inline-start: .6rem; }
    p { max-width: 80ch; } nav { display: flex; gap: 1rem; flex-wrap: wrap; }
    @media (max-width: 600px) { table { font-size: .9rem; } th,td { padding-inline: .2rem; } }
  </style>
</head>
<body>
  <h1>Pregled animacija aktera</h1>
  <p id="totals" aria-live="polite">Učitavanje rezultata…</p>
  <nav><a href="#2d">2D akteri</a><a href="#3d">3D akteri</a><a href="catalog.html">Katalog</a></nav>
  <main id="results"></main>
  <script type="module">
    const node = (tag, text) => {
      const element = document.createElement(tag)
      if (text !== undefined) element.textContent = text
      return element
    }
    const link = (text, address) => {
      const a = node('a', text)
      a.href = address
      return a
    }
    function table(parent, headers, rows) {
      const table = node('table')
      const heading = table.createTHead().insertRow()
      for (const header of headers) heading.append(node('th', header))
      const body = table.createTBody()
      for (const cells of rows) {
        const row = body.insertRow()
        for (const value of cells) row.insertCell().textContent = value
      }
      parent.append(table)
    }
    const notes = {
      'zastavnik': 'Nenaoružani zastavnik nosi zastavu dok hoda. Obe varijante imaju pad.',
      'posada-topa': 'Posada služi nepokretnom oruđu. Punjenje i trzaj posade mogu se videti odvojeno od topa.',
      'ustanak-top': 'Nepokretni Schneider se puni i opaljuje. Posada ima sopstveni atlas punjenja.',
      'nemac-u-rovu': 'Cela figura izvan zaklona. U Neretvi se nezavisni rov crta ispred vojnika.',
      'cetnik-u-rovu': 'Cela figura izvan zaklona. Smrt završava na zemlji, a narednog vojnika u zaklon dovodi nivo.',
      'bombas': 'Bacanje ima nacrtane faze do otpuštanja i prazan dlan posle njega. Na kraju smrti ostaje krv.',
      'ju87-obrusavac': 'Obrušavanje oslobađa jednu bombu. Avion izvlači nos i vraća se na početnu visinu.',
      'potez': 'Obaranje, kontakt sa tlom i poleganje prethode mirnoj olupini. Zadnji strelac ima sopstveni pravac.',
      'bp42': 'Jedan hitac pokreće šest kadrova trzaja cevi. Voz miruje po završetku.',
      'opel-blitz': 'Transportni kamion ima vožnju i olupinu. U ovoj ulozi nema oružja.',
      'opel-blitz-legija': 'Transportni kamion ima vožnju i olupinu. U ovoj ulozi nema oružja.',
      'schnellboot': 'Plovilo može da plovi, puca, povlači se i potone.',
      'partizanski-camac': 'Čamac ima nepokretan trup u kadru, paljbu i oštećeni trup po uništenju.',
      'flak38': 'Nepokretno oruđe okreće cev, ispaljuje projektil i ima zasebnu olupinu.',
      'pak38': 'Nepokretno protivtenkovsko oruđe ima paljbu i zasebnu olupinu.',
      'kuca-bunker': 'Stacionaran zaklon. Paljba i požar prate telo, uništena kuća ima sopstvenu sliku.',
      'bunker-do-trsta': 'Stacionaran bunker. Uništenje prikazuje ruševinu i požar.',
      'mitraljesko-gnezdo': 'Stacionarni položaj koristi usmerenu paljbu.',
      'radnik-3d': 'Civilni radnik može da hoda, primi pogodak i padne.',
      'ratni-avion-3d': 'Avion u krstarenju leti prema horizontu. Bočno upravljanje ga pomera u kadru. Raketa, sletanje i obaranje rade na telu iz igre.',
      'kula-3d': 'Kula stoji na mestu. Postavljena meta izaziva stvarno opaljenje. Po uništenju prestaje paljba, a konstrukcija gori na postojećem modelu.',
    }
    function evidence(c) {
      const facts = []
      if (c.shots) facts.push('Opaljenja ' + c.shots)
      if (c.hits) facts.push('Primljeni pogoci ' + c.hits)
      if (c.moved) facts.push('Pomeraj tela')
      return facts.join(' · ') || '—'
    }
    const translation = { health: 'samo zdravlje', pose: 'mirna poza', translation: 'pomeranje tela', effect: 'efekat',
      armor: 'uništenje tenka' }
    const describe = value => translation[value] ?? value
    function showCharacter(target, actor) {
      const rows = [['Mirovanje', describe(actor.idle[1])], ['Kretanje', describe(actor.move[1])]]
      for (const action of actor.actions) rows.push([action.name, [describe(action.show), action.burn && 'vidljiv efekat',
        action.events && 'borbeni događaji ' + action.events].filter(Boolean).join(' · ')])
      if (!actor.attackEnabled) rows.push(['Napad', 'Uloga nema borbeni napad'])
      rows.push(['Pogodak', describe(actor.hit)], ['Smrt', describe(actor.dead.clip) + (actor.dead.held ? ' · zadržan kraj' : '')])
      table(target, ['Radnja modela', 'Klip ili način prikaza'], rows)
    }
    async function render() {
      const response = await fetch('docs/references/katalog-animacije.json')
      if (!response.ok) throw Error('Izveštaj nije dostupan (' + response.status + ')')
      const report = await response.json()
      const main = document.querySelector('main')
      const stories = new Set(report.map(row => row.path.split('/').slice(0, 2).join('/'))).size
      const actions = report.reduce((n, row) => n + row.controls.length, 0)
      const missing = report.filter(row => row.unavailable).map(row => row.name)
      document.querySelector('#totals').textContent = stories + ' priča · ' + report.length + ' izgleda · ' + actions +
        ' proverenih komandi.' + (missing.length ? ' Izbor modela još čekaju ' + missing.join(' i ') + '.' : '')
      for (const dimension of ['2d','3d']) {
        const title = node('h2', dimension.toUpperCase() + ' akteri')
        title.id = dimension
        main.append(title)
        for (const row of report.filter(item => item.dimension === dimension)) {
          const [, id, look] = row.path.split('/')
          const details = node('details'), inner = node('div')
          details.append(node('summary', row.name + (look ? ' · ' + look : '') + (row.unavailable ? ' · čeka model' : '')), inner)
          inner.append(link('Otvori priču', 'catalog.html#' + row.path), node('p', row.game))
          if (row.unavailable) inner.append(node('p', row.unavailable))
          else {
            if (notes[id]) inner.append(node('p', notes[id]))
            if (row.character) showCharacter(inner, row.character)
            table(inner, ['Komanda', 'Zabeležena stanja', 'Klip ili kadrovi²', 'Događaj', 'Uzorci¹'],
              row.controls.map(c => [c.label, c.states.join(' → '), c.clips.join(', ') || c.frames.join(', ') || '—',
                evidence(c), c.distinctImages + '/7']))
          }
          main.append(details)
        }
      }
      main.append(node('p', '¹ Broj različitih slika među sedam uzoraka cele pozornice tokom šest sekundi. Uključuje efekte i kretanje kamere.'))
      main.append(node('p', '² Prikaz prijavljuje naziv klipa ili broj kadra kada ga ima. Crtica označava da taj podatak nema javno ime u prikazu. Nazivi klipova u tabeli 3D modela dolaze iz učitane animacije.'))
    }
    render().catch(error => { document.querySelector('#totals').textContent = error.message })
  </script>
</body>
</html>
