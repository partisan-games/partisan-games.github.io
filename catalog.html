<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Katalog aktera</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/ui/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/libs/three/build/three.module.min.js",
        "three/": "/libs/three/"
      }
    }
  </script>
  <style>
    body { overflow: hidden; }
    #platno, #platno-3d { position: fixed; inset: 0; }
    body[data-stage="3d"] #platno, body[data-stage="2d"] #platno-3d { display: none; }
    body[data-stage="unavailable"] canvas { display: none; }
    .catalog-panel, .catalog-list {
      position: fixed; top: 12px; z-index: 10; width: 220px; max-height: calc(100vh - 24px); overflow: auto;
      padding: 12px; background: rgb(0 0 0 / .7); font: 14px/1.4 system-ui, sans-serif; text-shadow: none;
    }
    .catalog-panel { right: 12px; }
    .catalog-list { left: 12px; }
    .catalog-list > div > details + details { margin-top: 12px; padding-top: 8px; border-top: 1px solid #666; }
    .catalog-list details details { margin-left: 8px; }
    .catalog-list section { margin-left: 8px; }
    .catalog-list h3 { margin: 8px 0 4px; font: 700 14px/1.3 system-ui, sans-serif; }
    .catalog-list details details summary { font-size: 14px; }
    .catalog-list input { box-sizing: border-box; width: 100%; min-width: 0; margin-bottom: 8px; padding: 7px; font: inherit; }
    .catalog-list [hidden] { display: none; }
    .catalog-list summary { padding: 4px 0; font: 700 16px/1.3 system-ui, sans-serif; cursor: pointer; }
    .catalog-list summary:focus-visible { outline: 2px solid #e4c86c; outline-offset: 3px; }
    .catalog-categories { padding-top: 8px; }
    .catalog-panel h2, .catalog-list h2 { margin: 0 0 8px; font: 600 15px/1.3 system-ui, sans-serif; }
    .catalog-list h2:not(:first-child) { margin-top: 16px; }
    .catalog-panel p { margin: 0 0 12px; color: #bbb; }
    .catalog-list a { display: block; padding: 3px 6px; color: #ddd; text-decoration: none; }
    .catalog-list .catalog-home { margin-bottom: 8px; padding: 0; color: #e4c86c; }
    .catalog-list a[aria-current="true"] { background: #6a5d2c; color: white; }
    .catalog-health { display: block; margin-top: 8px; }
    .catalog-health progress { display: block; box-sizing: border-box; width: 100%; min-width: 0; }
    .catalog-panel fieldset { margin: 0 0 12px; padding: 8px; border: 1px solid #666; }
    .catalog-panel legend { padding: 0 4px; color: #bbb; }
    .catalog-panel button {
      margin: 2px; padding: 4px 8px; border: 1px solid #888; background: #333; font: 13px/1.3 system-ui, sans-serif;
      text-shadow: none; cursor: pointer;
    }
    .catalog-panel button[aria-pressed="true"] { background: #6a5d2c; }
    .catalog-panel .catalog-shot { display: block; }
    .catalog-heading { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .catalog-panel .catalog-heading h2 { margin: 0 4px 0 0; }
    .catalog-panel .catalog-heading button { min-width: 26px; margin: 0; padding: 2px 6px; }
    .catalog-season { padding: 8px; border: 1px solid #c9b568; color: #f4df9b; font-weight: 600; }
    @media (max-width: 600px) {
      .catalog-list { top: auto; bottom: 12px; left: 16px; right: 16px; width: auto; max-height: 35vh; }
      .catalog-panel { left: 16px; right: 16px; width: auto; }
    }
  </style>
</head>
<body>
  <canvas id="platno"></canvas>
  <canvas id="platno-3d"></canvas>
  <main id="ui"></main>
  <div id="modal"></div>
  <nav class="catalog-list" id="catalog-list" aria-label="Katalog aktera"><a class="catalog-home" href="/">← Početna</a></nav>
  <aside class="catalog-panel" id="catalog-panel"></aside>
  <script type="module" src="/catalog/main.js"></script>
</body>
</html>
